name: Build HueCai

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64, tar.gz)'
        type: boolean
        default: false
      build_appimage:
        description: 'Linux AppImage (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_android:
        description: 'Android (APK)'
        type: boolean
        default: false
      build_ios:
        description: 'iOS (IPA)'
        type: boolean
        default: false
      build_web:
        description: 'Web'
        type: boolean
        default: false
      publish_release:
        description: '发布为 Releases（上传构建产物到 GitHub Releases）'
        type: boolean
        default: false

jobs:
  windows:
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1]
          $parts = $ver.Split('+')
          echo "BUILD_NAME=$($parts[0])" >> $env:GITHUB_ENV
          echo "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Write config
        shell: pwsh
        run: |
          $json = @{
            BUILD_VERSION = "$env:BUILD_NAME"
            BUILD_NUMBER  = "$env:BUILD_NUMBER"
          } | ConvertTo-Json -Compress
          Set-Content config.json -Value $json -Encoding utf8
      - name: Get dependencies
        run: flutter pub get
      - name: Build portable (zip)
        run: |
          flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define-from-file=config.json
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath huecai-windows-$env:BUILD_NAME-portable.zip
      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $name = "绘彩"
          $exe = "build\windows\x64\runner\Release\hue_cai.exe"
          $iss = @"
          [Setup]
          AppName=$name
          AppVersion=$env:BUILD_NAME
          DefaultDirName={autopf}\HueCai
          DefaultGroupName=$name
          OutputDir=installer_output
          OutputBaseFilename=huecai-setup-$env:BUILD_NAME
          UninstallDisplayIcon={app}\hue_cai.exe
          [Files]
          Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          $iss | Out-File setup.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-Windows-portable
          path: huecai-windows-${{ env.BUILD_NAME }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-Windows-installer
          path: installer_output/*.exe

  linux:
    if: inputs.build_linux || inputs.build_appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Package tar.gz
        if: inputs.build_linux
        run: tar -czf huecai-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        if: inputs.build_linux
        with:
          name: huecai-Linux
          path: huecai-linux-${{ env.BUILD_NAME }}.tar.gz
      - name: Build AppImage
        if: inputs.build_appimage
        run: |
          # appimagetool 自身也是 AppImage；CI 环境常无 FUSE，
          # 统一用 --appimage-extract-and-run 运行。
          curl -sL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          APPDIR=hue_cai.AppDir
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          # Flutter Linux bundle：hue_cai + lib/ + data/（RPATH=$ORIGIN/lib），
          # 整体放进 AppDir 根即可从任意位置启动。
          cp -r build/linux/x64/release/bundle/. "$APPDIR/"
          cp web/icons/Icon-512.png \
            "$APPDIR/usr/share/icons/hicolor/512x512/apps/huecai.png"
          ln -sf usr/share/icons/hicolor/512x512/apps/huecai.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/huecai.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=绘彩
          Exec=AppRun
          Icon=huecai
          Terminal=false
          Categories=Graphics;
          X-AppImage-Version=${BUILD_NAME}
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/hue_cai" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            "$APPDIR" "huecai-linux-${BUILD_NAME}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        if: inputs.build_appimage
        with:
          name: huecai-Linux-AppImage
          path: huecai-linux-*-x86_64.AppImage
          if-no-files-found: error

  macos:
    if: inputs.build_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../huecai-macos-${{ env.BUILD_NAME }}.zip hue_cai.app
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-macOS
          path: huecai-macos-${{ env.BUILD_NAME }}.zip

  android:
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-Android
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Decode certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 -d > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        if: env.IOS_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | \
            xmllint --xpath "string(//key[.='UUID']/following-sibling::string[1])" -)
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "IOS_PROVISIONING_PROFILE_NAME=$UUID" >> $GITHUB_ENV
      - name: Set signing flag
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "HAS_SIGNING=1" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=0" >> $GITHUB_ENV
          fi
      - name: Build IPA (unsigned)
        if: env.HAS_SIGNING == '0'
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/ios/debug-info --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
          find build/ios/iphoneos/Runner.app -type f -exec sh -c 'file -b "$1" | grep -q "^Mach-O" && strip -S "$1"' _ {} \; 2>/dev/null || true
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r Runner.ipa Payload/ && cd -
      - name: Build IPA (signed)
        if: env.HAS_SIGNING == '1'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: "Apple Distribution"
        run: flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-iOS
          path: build/ios/ipa/*.ipa

  web:
    if: inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": ""
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release --dart-define-from-file=config.json
      - name: Create zip archive
        run: |
          cd build/web
          zip -r ../../huecai-web-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: huecai-Web
          path: huecai-web-${{ env.BUILD_NAME }}.zip

  # 汇总任务：勾选“发布为 Releases”后，把本次成功构建的产物上传到
  # GitHub Releases。Release 标题与 tag 均为「版本号+构建数字」
  # （如 1.2.3+42）；若 Release 里已有同名文件则跳过该文件的上传，
  # 其余文件照常补传（可重复运行）。
  release:
    if: inputs.publish_release && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [windows, linux, macos, android, ios, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "TAG=${BUILD_NAME}+${BUILD_NUMBER}" >> $GITHUB_ENV
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release (if missing)
        run: |
          if ! ls dist/* >/dev/null 2>&1; then
            echo "::warning::没有可上传的构建产物，跳过 Release"
            echo "EMPTY=1" >> $GITHUB_ENV
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，只补传缺失的文件"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "HueCai 自动构建：$TAG"
            echo "已创建 Release $TAG"
          fi
      - name: Upload assets (skip same-name)
        if: env.EMPTY != '1'
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          uploaded=0
          skipped=0
          for f in dist/*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq -- "$name"; then
              echo "跳过（同名文件已存在）：$name"
              skipped=$((skipped+1))
            else
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$f"
              echo "已上传：$name"
              uploaded=$((uploaded+1))
            fi
          done
          echo "共上传 $uploaded 个，跳过 $skipped 个"
